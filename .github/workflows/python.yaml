name: api download test ci

on:
  push:
    branches: ["main", "1-us-01/US-01-api-extraction"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true


      - name: Install Python
        run: uv python Install

      - name: Run tests
        run: uv run --locked pytest -v
